name: Desktop installers

# A v* tag builds and publishes desktop installers with update metadata. The updater discovers complete desktop tags;
# unrelated archive releases can safely be the repository's latest release. workflow_dispatch does not publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux, builder: --linux }
          - { os: windows-2022, target: win, builder: --win }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/desktop/package-lock.json
            src/frontend/tools/browser/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install desktop dependencies
        run: npm ci --prefix src/desktop --no-audit --no-fund
      - name: Build the interface
        run: |
          npm ci --prefix src/frontend --engine-strict --no-audit --no-fund
          npm run build --prefix src/frontend
          npm test --prefix src/desktop
      - name: Stage the backend
        run: uv run --no-project --python 3.12 python src/desktop/scripts/stage_backend.py --target ${{ matrix.target }}
      - name: Check the staged backend on this operating system
        shell: bash
        run: uv run --no-project --python 3.12 python src/desktop/test/backend_smoke.py --backend src/desktop/build/backend/${{ matrix.target }} --out "$RUNNER_TEMP/smoke-${{ matrix.target }}" --node "$(command -v node)"
      - name: Build the installers
        working-directory: src/desktop
        env:
          # Signing is skipped while these are empty; see setup/README.md.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npx electron-builder ${{ matrix.builder }} --publish never
      - name: Prepare Linux window checks
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
          npm ci --prefix src/frontend/tools/browser --no-audit --no-fund
      - name: Open the packaged Linux window and exercise IPC and data flows
        if: matrix.target == 'linux'
        timeout-minutes: 12
        env:
          # Only this isolated hosted-runner smoke disables the Chromium sandbox.
          CERES_TEST_NO_SANDBOX: '1'
        run: |
          export PLAYWRIGHT_CORE="$GITHUB_WORKSPACE/src/frontend/tools/browser/node_modules/playwright-core"
          xvfb-run -a node src/desktop/test/packaged_smoke.mjs --exe "$GITHUB_WORKSPACE/src/desktop/dist/linux-unpacked/agri-route-workbench" --out "$RUNNER_TEMP/desktop-window-smoke"
      - name: Preserve Linux window check evidence
        if: always() && matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: window-smoke-linux
          path: ${{ runner.temp }}/desktop-window-smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Install on this Windows machine and check what landed
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src/desktop/dist/*-windows-x64.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S', '/currentuser' -Wait
          $backend = Join-Path $env:LOCALAPPDATA 'Programs/agri-route-workbench/resources/backend'
          uv run --no-project --python 3.12 python src/desktop/test/backend_smoke.py --backend $backend --out "$env:RUNNER_TEMP/smoke-installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src/desktop/dist/*.AppImage
            src/desktop/dist/*.deb
            src/desktop/dist/*.exe
            src/desktop/dist/*.blockmap
            src/desktop/dist/latest*.yml
          if-no-files-found: error

  images:
    needs: checks
    uses: ./.github/workflows/images.yml
    with:
      checks_passed: true
      publish_channels: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, images]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true
      - name: Verify optional data and installer publication metadata
        run: python3 src/desktop/scripts/check_release.py --artifacts artifacts --version "${GITHUB_REF_NAME#v}"
      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "工作台 $GITHUB_REF_NAME" --generate-notes --latest
