name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_channels:
        description: 'Promote verified digests to main or version channels'
        type: boolean
        default: false
  workflow_call:
    inputs:
      checks_passed:
        type: boolean
        default: false
      publish_channels:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SOURCE: https://github.com/peakpeng666/URP

jobs:
  checks:
    if: ${{ !inputs.checks_passed }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  bench:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    needs: checks
    if: ${{ always() && (needs.checks.result == 'success' || (inputs.checks_passed && needs.checks.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *
            !src/repos/**
            !data/bpp/**
            !data/cifar-training/**
            !experiments/**
            !literature/**
            !materials/**
            !papers/**
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push ceres-bench
        id: publish
        run: bash deploy/publish-image.sh bench deploy/Dockerfile
      - name: Retain bench image acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-bench-${{ github.sha }}
          path: .local-state/image-bench
          include-hidden-files: true
          if-no-files-found: warn

  sim:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    needs: checks
    if: ${{ always() && (needs.checks.result == 'success' || (inputs.checks_passed && needs.checks.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *
            !src/repos/**
            !data/bpp/**
            !data/cifar-training/**
            !experiments/**
            !literature/**
            !materials/**
            !papers/**
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push ceres-sim
        id: publish
        run: bash deploy/publish-image.sh sim deploy/Dockerfile.simulation
      - name: Retain sim image acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-sim-${{ github.sha }}
          path: .local-state/image-sim
          include-hidden-files: true
          if-no-files-found: warn

  verify-public-pull:
    needs: [bench, sim]
    if: always() && needs.bench.result == 'success' && needs.sim.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      bench_digest: ${{ steps.verify.outputs.bench_digest }}
      sim_digest: ${{ steps.verify.outputs.sim_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: deploy
      - name: Verify anonymous pulls of this run's exact manifests
        id: verify
        env:
          BENCH_DIGEST: ${{ needs.bench.outputs.digest }}
          SIM_DIGEST: ${{ needs.sim.outputs.digest }}
        run: bash deploy/verify-published-images.sh

  promote-channels:
    needs: [bench, sim, verify-public-pull]
    if: ${{ always() && needs.bench.result == 'success' && needs.sim.result == 'success' && needs.verify-public-pull.result == 'success' && (inputs.publish_channels || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    # Constant across direct and reusable callers, branches, tags, and reruns.
    concurrency:
      group: ceres-image-channel-promotion
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: deploy
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Promote checked image digests to channels
        env:
          BENCH_DIGEST: ${{ needs.verify-public-pull.outputs.bench_digest }}
          SIM_DIGEST: ${{ needs.verify-public-pull.outputs.sim_digest }}
        run: bash deploy/promote-images.sh
