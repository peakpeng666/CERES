# ROS 2 Humble + Fortress ONLY. ignition.msgs, but modern package name ros_gz_bridge.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /ceres_synthetic/cmd_vel
  gz_topic_name: /ceres_synthetic/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: /ceres_synthetic/odom
  gz_topic_name: /ceres_synthetic/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /ceres_synthetic/ground_truth
  gz_topic_name: /ceres_synthetic/ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /ceres_synthetic/imu
  gz_topic_name: /ceres_synthetic/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /ceres_synthetic/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS
