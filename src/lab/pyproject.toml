[project]
name = "ceres-lab"
version = "0.1.0"
description = "CERES 科研面板：网关、求解适配、路径检查、推荐与仿真编排（不改写 src/research 冻结模块）"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.1",
  "starlette==1.8.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "websockets==17.2",
  "pyyaml==6.0.3",
  "pyvrp==0.14.0",
  "vrplib==2.2.0",
  "ortools==9.15.6755",
  "shapely==2.2.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "matplotlib==3.11.2",
  "pillow==12.3.0",
  "ompl==2.0.1; sys_platform != 'win32'",
  "pyproj==3.8.0",
  "python-multipart==0.0.32",
  "defusedxml==0.7.1",
  "opencv-python-headless==5.0.0.93",
  "mujoco==3.17.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
