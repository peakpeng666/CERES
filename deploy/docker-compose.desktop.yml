# Added by the desktop app on top of docker-compose.sim.yml: the container sees the same model connections as the app.
# URP_HOST_CONFIG is the app's configuration directory on the host. A bind mount from Windows reports open file modes,
# so the private-file check is relaxed here; the directory itself stays in the user's profile.
services:
  lab:
    user: "${URP_HOST_UID:-1000}:${URP_HOST_GID:-1000}"
    environment:
      URP_CONFIG_DIR: /config
      URP_LLM_CONFIG: /config/llm.json
      URP_LLM_CREDENTIALS: /config/credentials.json
      URP_CREDENTIALS_MOUNTED: "1"
      URP_MODELS_REFRESH: "1"
    volumes:
      - ${URP_HOST_CONFIG:?}:/config
      # Same records in native and simulation modes. Matching UID preserves the host's 0600 credentials.
      - ${URP_HOST_RUNTIME:?}:/data/lab
      - ${URP_HOST_ARCHIVE:?}:/data/archive
      - ${URP_HOST_DATASET:?}:/data/dataset.json:ro
