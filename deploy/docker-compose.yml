# Workbench for Docker Desktop (Windows or Linux). The published port is the host's
# loopback only. The process inside the container listens on 0.0.0.0 so the proxy can reach it.
# Do not switch this to network_mode: host; Docker Desktop on Windows has no host network.
name: urp-lab

services:
  lab:
    image: ghcr.io/peakpeng666/urp-bench:${CERES_IMAGE_TAG:-${URP_IMAGE_TAG:-main}}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${CERES_PUBLISH_HOST:-${URP_PUBLISH_HOST:-127.0.0.1}}:${CERES_PORT:-${URP_PORT:-4100}}:4100"
    environment:
      CERES_BIND_HOST: "0.0.0.0"
      URP_BIND_HOST: "0.0.0.0"
      # CERES_PORT configures the host port above; the container always serves 4100.
      CERES_PORT: "4100"
      URP_PORT: "4100"
      CERES_LAB_RUNTIME: /data/lab
      URP_LAB_RUNTIME: /data/lab
      CERES_API_DB: /data/archive/research.sqlite3
      URP_API_DB: /data/archive/research.sqlite3
      CERES_FOXGLOVE_BIND: "0.0.0.0"
      URP_FOXGLOVE_BIND: "0.0.0.0"
      CERES_BROWSER_HOST: "127.0.0.1"
      URP_BROWSER_HOST: "127.0.0.1"
      CERES_EXTRA_HOSTS: "${CERES_EXTRA_HOSTS:-${URP_EXTRA_HOSTS:-}}"
      URP_EXTRA_HOSTS: "${CERES_EXTRA_HOSTS:-${URP_EXTRA_HOSTS:-}}"
      CERES_ADMIN_TOKEN: "${CERES_ADMIN_TOKEN:-${URP_ADMIN_TOKEN:-}}"
      URP_ADMIN_TOKEN: "${CERES_ADMIN_TOKEN:-${URP_ADMIN_TOKEN:-}}"
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
    volumes:
      - lab-runtime:/data/lab
      - archive-data:/data/archive
    shm_size: "256mb"

volumes:
  lab-runtime:
  archive-data:
